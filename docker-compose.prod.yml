services:
  # ============ PostgreSQL ============
  postgres:
    image: postgres:16-alpine
    container_name: netguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netguard_secret}
      POSTGRES_DB: ${POSTGRES_DB:-netguard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netguard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - netguard

  # ============ ClickHouse ============
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: netguard-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: netguard
      CLICKHOUSE_USER: netguard
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_secret}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - netguard

  # ============ API Go ============
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: netguard-api
    restart: unless-stopped
    environment:
      API_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-netguard}:${POSTGRES_PASSWORD:-netguard_secret}@postgres:5432/${POSTGRES_DB:-netguard}?sslmode=disable
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_USER: netguard
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_secret}
      JWT_SECRET: ${JWT_SECRET:-change_me}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - netguard

  # ============ Frontend + Nginx (container) ============
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: netguard-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"     # ← Akses via http://localhost
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - netguard

  # ============ Migration Runner ============
  migrate:
    image: postgres:16-alpine
    container_name: netguard-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api/migrations/postgres:/migrations:ro
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-netguard_secret}
    entrypoint: >
      sh -c "
      for f in /migrations/*.sql; do
        echo \"Running $$f...\";
        psql -h postgres -U ${POSTGRES_USER:-netguard} -d ${POSTGRES_DB:-netguard} -f $$f || exit 1;
      done;
      echo 'Migrations done!';
      "
    networks:
      - netguard
    profiles:
      - migrate

volumes:
  postgres_data:
  clickhouse_data:

networks:
  netguard:
    driver: bridge